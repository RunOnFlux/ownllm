# FluxEdge training job. See finetune/run-edge.sh for what runs inside.
#
# Rules learned from fluxedge-ollama: no hostNetwork; declare the port so an
# HTTPS ingress is minted (that is how results come out - there is no shell);
# explicit nameservers because cluster DNS does not resolve public names;
# resource requests well under the machine's advertised specs or the pod
# sits pending and is reaped after ~5 minutes with no error;
# runtimeClassName nvidia + NVIDIA_VISIBLE_DEVICES, or premium (Hyperstack)
# nodes start the pod with no GPU at all (job 16886: "gpu: none").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxai-train
  labels:
    app: fluxai-train
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: fluxai-train
  template:
    metadata:
      labels:
        name: fluxai-train
        app: fluxai-train
    spec:
      runtimeClassName: nvidia
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      containers:
        - name: train
          # CUDA 12.4 devel image with python + torch preinstalled; devel so
          # llama.cpp's quantizer can be built for the conversion step.
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
          command: ["/bin/bash", "-c"]
          args:
            - |
              apt-get update -qq && apt-get install -y -qq curl >/dev/null 2>&1
              curl -fsSL "${SCRIPT_URL}" -o /run-edge.sh && bash /run-edge.sh
          env:
            - name: SCRIPT_URL
              value: "https://raw.githubusercontent.com/RunOnFlux/ownllm/master/finetune/run-edge.sh"
            - name: BASES
              value: "ibm-granite/granite-4.0-h-tiny"
            - name: EPOCHS
              value: "2"
            - name: QLORA
              value: ""          # set to "1" on a 24 GB card
            - name: TRAIN_ARGS
              value: ""           # e.g. "--max-len 1536 --batch 1 --grad-accum 16"; empty = script default
            - name: PIP_EXTRA
              # the Mamba-2 CUDA kernels; without them the fallback path is
              # quadratic in sequence length and OOMs an 80 GB card at 6144.
              # --no-deps keeps the image's torch; these pins are the pairing
              # with wheels for torch 2.5.1 (1.4.0 has none; 1.5.2+ changed the
              # causal_conv1d_fwd signature that mamba-ssm 2.2.4 calls).
              value: "--no-deps einops causal-conv1d==1.5.0.post8 mamba-ssm==2.2.4"
            - name: PORT
              value: "8080"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: HF_HOME
              value: "/work/hf"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              ephemeral-storage: "20Gi"
            limits:
              nvidia.com/gpu: 1
              memory: "48Gi"
              ephemeral-storage: "80Gi"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 150Gi
