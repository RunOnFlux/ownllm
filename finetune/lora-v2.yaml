# mlx-lm LoRA config for the v2 run: twice the rank of v1 and more layers,
# because v1 (rank 16, 16 layers) learned the protocol but stayed brittle to
# surface wording. Everything else is on the command line.
# Sequence length must cover the longest pair: MCP-surface prompts are 3.7-6.2k
# tokens, and a pair truncated below its completion yields NaN loss (first v2
# attempt at 3072 went NaN at iter 1).
lora_parameters:
  rank: 32
  scale: 20.0
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mamba.in_proj", "mamba.out_proj", "shared_mlp.input_linear", "shared_mlp.output_linear"]
# Attempt 3 (constant 5e-5, batch 1) diverged at iteration ~50 (loss 1.3 -> 8).
# Warm up over 300 steps, cosine-decay to 3e-6, and accumulate 4 samples per
# optimizer step so a single short "Yes" completion cannot blow up Adam.
lr_schedule:
  name: cosine_decay
  warmup: 300
  arguments: [3.0e-5, 12000, 3.0e-6]
