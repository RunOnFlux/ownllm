name: build images

on:
  push:
    branches: [main, master]
    paths: ['images/**', '.github/workflows/gate.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [gate, docsbot, router, ternary]
        include:
          # bitnet.cpp's I2_S kernel is a separate code path per ISA and the
          # research rig only targets x86 Flux nodes. Not an enterprise
          # component's constraint either: amd64 is the mandatory one.
          - image: ternary
            platforms: linux/amd64
    permissions:
      contents: read
      packages: write
    steps:
      # lfs: true is mandatory once the corpus is in LFS. Without it checkout
      # writes 130-byte pointer files, the Docker build copies those into the
      # image, and the bot starts, finds a "corpus" that parses as nothing, and
      # serves an empty index - a failure that looks like bad retrieval rather
      # than a missing file.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository_owner is "RunOnFlux", but registry paths must be
      # lowercase. Computed rather than hardcoded so forks keep working.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # images/gate/VERSION is the single source of truth for the gate's
      # version - tools/gen.js reads the same file when it writes a repotag, so
      # the spec and the published image cannot drift. Bump it to publish;
      # never move an existing version tag, or running instances and new ones
      # silently differ.
      - id: version
        run: echo "v=$(tr -d '[:space:]' < images/gate/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          # amd64 is MANDATORY: enterprise apps are rejected unless every
          # component supports it (appConstants.js enterpriseRequiredArchitectures).
          # Building locally on an Apple Silicon Mac produces arm64 only and the
          # registration will fail validation.
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/ownllm-${{ matrix.image }}:${{ steps.version.outputs.v }}
            ghcr.io/${{ steps.owner.outputs.lc }}/ownllm-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/ownllm-${{ matrix.image }}:latest
