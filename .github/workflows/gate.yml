name: build gate image

on:
  push:
    branches: [main, master]
    paths: ['images/gate/**', '.github/workflows/gate.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository_owner is "RunOnFlux", but registry paths must be
      # lowercase. Computed rather than hardcoded so forks keep working.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # images/gate/VERSION is the single source of truth for the gate's
      # version - tools/gen.js reads the same file when it writes a repotag, so
      # the spec and the published image cannot drift. Bump it to publish;
      # never move an existing version tag, or running instances and new ones
      # silently differ.
      - id: version
        run: echo "v=$(tr -d '[:space:]' < images/gate/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: images/gate
          push: true
          # amd64 is MANDATORY: enterprise apps are rejected unless every
          # component supports it (appConstants.js enterpriseRequiredArchitectures).
          # Building locally on an Apple Silicon Mac produces arm64 only and the
          # registration will fail validation.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/ownllm-gate:${{ steps.version.outputs.v }}
            ghcr.io/${{ steps.owner.outputs.lc }}/ownllm-gate:sha-${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/ownllm-gate:latest
